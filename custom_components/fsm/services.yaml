trigger:
  name: Trigger FSM transition
  description: Trigger a transition on a finite state machine.
  fields:
    fsm_id:
      description: Stable FSM id from the configuration. Provide this or `entity_id` (at least one; if both, they must refer to the same FSM).
      example: alarm_mode_fsm
      selector:
        text:
    entity_id:
      description: Entity id of the FSM to target. Provide this or `fsm_id` (at least one; if both, they must refer to the same FSM).
      example: select.alarm_mode_fsm
      selector:
        entity:
          domain: select
    trigger_id:
      description: The trigger ID defined in the FSM configuration.
      example: arm_home
      required: true
      selector:
        text:

set_state:
  name: Set FSM state
  description: Force the FSM into a specific state.
  fields:
    fsm_id:
      description: Stable FSM id from the configuration. Provide this or `entity_id` (at least one; if both, they must refer to the same FSM).
      example: alarm_mode_fsm
      selector:
        text:
    entity_id:
      description: Entity id of the FSM to target. Provide this or `fsm_id` (at least one; if both, they must refer to the same FSM).
      example: select.alarm_mode_fsm
      selector:
        entity:
          domain: select
    state:
      description: The target state for the FSM.
      example: disarmed
      required: true
      selector:
        text:
